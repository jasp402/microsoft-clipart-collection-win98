name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "No package.json, skipping install"
          fi

      - name: Build / Export static
        run: |
          if [ -f package.json ]; then
            if grep -q '"export"' package.json; then
              npm run export || true
            else
              npm run build || true
            fi
          else
            echo "No package.json, skipping build"
          fi

      - name: Prepare output for Pages
        run: |
          # Start with a clean out directory
          rm -rf out
          mkdir -p out

          # Prefer dist, then build, then docs
          if [ -d "dist" ]; then
            cp -r dist/* out/ || true
          fi

          if [ -d "build" ]; then
            cp -r build/* out/ || true
          fi

          if [ -d "docs" ]; then
            cp -r docs/* out/ || true
          fi

          # If out is still empty, create a minimal placeholder index.html
          if [ -z "$(ls -A out)" ]; then
            echo '<!doctype html>' > out/index.html
            echo '<meta charset="utf-8">' >> out/index.html
            echo '<title>Coming soon</title>' >> out/index.html
            echo '<h1>Site coming soon</h1>' >> out/index.html
          fi

      - name: Prepare artifact directory (for deploy)
        run: |
          ls -la out || true

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
