name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json, skipping install"
          fi

      - name: Build / Export static
        run: |
          if [ -f package.json ]; then
            if grep -q '"export"' package.json; then
              npm run export || true
            else
              npm run build || true
            fi
          else
            echo "No package.json, skipping build"
          fi

      - name: Prepare output for Pages
        run: |
          # Start with a clean out directory
          rm -rf out
          mkdir -p out

          # Prefer dist, then build, then docs
          if [ -d "dist" ]; then
            cp -r dist/* out/ || true
          fi

          if [ -d "build" ]; then
            cp -r build/* out/ || true
          fi

          if [ -d "docs" ]; then
            cp -r docs/* out/ || true
          fi

          # If out is still empty, create a minimal placeholder index.html
          if [ -z "$(ls -A out)" ]; then
            cat > out/index.html <<EOF
<!doctype html>
<meta charset="utf-8">
<title>Coming soon</title>
<h1>Site coming soon</h1>
EOF
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./out

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
